name: NDK build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Setup NDK r27c
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Create ndkpath.txt
        run: echo "${{ steps.setup-ndk.outputs.ndk-path }}" > ndkpath.txt

      # qpm-action downloads qpm from QPM.CLI CI artifacts, which expire; use the release binary
      - name: Install qpm
        run: |
          curl -sSL -o qpm.zip https://github.com/QuestPackageManager/QPM.CLI/releases/latest/download/qpm-linux-x64.zip
          unzip -q qpm.zip -d "$HOME/qpm" && rm qpm.zip
          chmod +x "$HOME/qpm/qpm"
          echo "$HOME/qpm" >> "$GITHUB_PATH"

      - name: Cache qpm packages
        uses: actions/cache@v4
        with:
          path: ~/.local/share/QPM-RS
          key: qpm-${{ hashFiles('qpm.shared.json') }}

      - name: Restore dependencies
        run: qpm restore

      - name: Solver unit test (host)
        run: mkdir -p build && ./test/run.sh

      - name: Build
        run: ./scripts/build.sh

      - name: Create qmod
        run: |
          qpm qmod manifest
          qpm qmod zip --skip_build EasyOffset.qmod

      - name: Upload qmod
        uses: actions/upload-artifact@v4
        with:
          name: EasyOffset.qmod
          path: ./EasyOffset.qmod
          if-no-files-found: error

      - name: Upload debug .so
        uses: actions/upload-artifact@v4
        with:
          name: debug_libeasyoffset.so
          path: ./build/debug/libeasyoffset.so
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            ./EasyOffset.qmod
            ./build/debug/libeasyoffset.so
